# Builds the app image (API server + website, see Dockerfile), pushes it to
# ECR in eraseai-prod tagged with the commit SHA, then rolls it out: the tag
# goes into SSM (/eraseai/app/image-tag) and the app stack is applied, which
# registers a new task definition and ECS replaces the tasks (circuit
# breaker rolls back if the new tasks fail health checks).
name: build

on:
  push:
    paths:
      - "artifacts/api-server/**"
      - "artifacts/eraseai/**"
      - "lib/**"
      - "extension/**"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  REPOSITORY: eraseai/app

jobs:
  image:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::110796370706:role/eraseai-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan result
        run: |
          aws ecr wait image-scan-complete --repository-name "$REPOSITORY" --image-id imageTag=${{ github.sha }}
          aws ecr describe-image-scan-findings --repository-name "$REPOSITORY" --image-id imageTag=${{ github.sha }} \
            --query 'imageScanFindings.findingSeverityCounts' --output json | tee counts.json
          { echo "### Image"; echo '```'; echo "${{ steps.ecr.outputs.registry }}/$REPOSITORY:${{ github.sha }}"; echo '```';
            echo "Vulnerability findings by severity:"; echo '```'; cat counts.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run: { working-directory: infra/workload/app }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.4, terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::110796370706:role/eraseai-github-deploy
          aws-region: ap-southeast-1
          role-duration-seconds: 3600
      - name: Set image tag
        run: aws ssm put-parameter --name /eraseai/app/image-tag --type String --overwrite --value "${{ github.sha }}" >/dev/null
      - run: terraform init -input=false
      - name: Roll out
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          terraform apply -input=false -no-color tfplan
          aws ecs wait services-stable --cluster eraseai --services eraseai-app
          { echo "### Deployed ${{ github.sha }}"; echo '```'; grep -E '^  # |^Plan:' plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        run: |
          for u in https://api.aws.eraseai.ai/api/healthz https://aws.eraseai.ai/api/healthz; do
            curl -fsS --retry 5 --retry-delay 10 "$u"; echo " <- $u"
          done
