# Builds the website (artifacts/eraseai) and deploys it to Amplify Hosting
# (app eraseai-web, branch main) as a zip deployment.
name: frontend

on:
  push:
    paths:
      - "artifacts/eraseai/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend.yml"
      - "infra/frontend-deploy-trigger"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter "@workspace/eraseai..."
      - name: Build
        run: PORT=8080 BASE_PATH=/ pnpm --filter @workspace/eraseai run build
      - name: Package
        run: cd artifacts/eraseai/dist/public && zip -qr "$GITHUB_WORKSPACE/site.zip" . && ls -l "$GITHUB_WORKSPACE/site.zip"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::110796370706:role/eraseai-github-deploy
          aws-region: ap-southeast-1
      - name: Deploy to Amplify
        run: |
          set -euo pipefail
          app=$(aws amplify list-apps --query "apps[?name=='eraseai-web'].appId | [0]" --output text)
          read -r job url < <(aws amplify create-deployment --app-id "$app" --branch-name main --query '[jobId,zipUploadUrl]' --output text)
          curl -sSf -X PUT -H "Content-Type: application/zip" --upload-file site.zip "$url"
          aws amplify start-deployment --app-id "$app" --branch-name main --job-id "$job" >/dev/null
          for i in $(seq 1 60); do
            st=$(aws amplify get-job --app-id "$app" --branch-name main --job-id "$job" --query 'job.summary.status' --output text)
            echo "job $job: $st"; case "$st" in SUCCEED) break;; FAILED|CANCELLED) exit 1;; esac; sleep 10
          done
          [ "$st" = SUCCEED ]
          dom=$(aws amplify get-app --app-id "$app" --query 'app.defaultDomain' --output text)
          { echo "### Website deployed"; echo "- https://main.$dom"; echo "- https://aws.eraseai.ai (once the domain is verified)"; } >> "$GITHUB_STEP_SUMMARY"
