<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EraseAI Firewall</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      min-height: 420px;
      background: #0f1017;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    .header {
      background: linear-gradient(135deg, #16171f 0%, #1a1b26 100%);
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: white;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 700;
      color: #f4f4f5;
    }

    .header-text p {
      font-size: 11px;
      color: #71717a;
      margin-top: 2px;
    }

    .section {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #71717a;
      margin-bottom: 12px;
    }

    /* Diagnosis card — colored by state */
    .diag {
      border-radius: 12px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      margin-bottom: 8px;
    }

    .diag.connected {
      border-color: rgba(34,197,94,0.35);
      background: rgba(34,197,94,0.08);
    }

    .diag.invalid_key {
      border-color: rgba(239,68,68,0.35);
      background: rgba(239,68,68,0.06);
    }

    .diag.no_key {
      border-color: rgba(99,102,241,0.35);
      background: rgba(99,102,241,0.07);
    }

    .diag.server_unreachable {
      border-color: rgba(245,158,11,0.4);
      background: rgba(245,158,11,0.06);
    }

    .diag-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .diag-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .diag.connected .diag-dot { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.5); }
    .diag.invalid_key .diag-dot { background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.5); }
    .diag.no_key .diag-dot { background: #6366f1; box-shadow: 0 0 8px rgba(99,102,241,0.5); }
    .diag.server_unreachable .diag-dot { background: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.5); }
    .diag.checking .diag-dot { background: #f59e0b; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .diag-title {
      font-size: 13px;
      font-weight: 600;
      color: #f4f4f5;
    }

    .diag-detail {
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .diag-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .last-attempt {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.4;
    }

    .last-attempt.empty {
      color: #52525b;
    }

    .last-attempt .last-attempt-status {
      font-weight: 600;
    }

    .last-attempt.success .last-attempt-status { color: #4ade80; }
    .last-attempt.error .last-attempt-status { color: #f87171; }
    .last-attempt.timeout .last-attempt-status { color: #fb923c; }

    .plan-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(34,197,94,0.18);
      color: #4ade80;
      margin-left: 4px;
    }

    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #27272a;
      border-radius: 22px;
      transition: 0.2s;
    }

    .toggle-slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      bottom: 3px;
      background: #71717a;
      border-radius: 50%;
      transition: 0.2s;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: #6366f1;
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(18px);
      background: white;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
    }

    .toggle-row .label {
      font-size: 13px;
      color: #d4d4d8;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #a1a1aa;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-field {
      flex: 1;
      padding: 9px 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #e4e4e7;
      font-size: 12px;
      font-family: monospace;
      outline: none;
      transition: border 0.15s;
      min-width: 0;
    }

    .input-field:focus {
      border-color: #6366f1;
    }

    .input-field::placeholder {
      color: #52525b;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }

    .btn-primary:hover {
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #d4d4d8;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.12);
    }

    .btn-tiny {
      padding: 4px 10px;
      font-size: 11px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .scan-summary {
      padding: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
    }

    .scan-summary .no-scans {
      text-align: center;
      color: #52525b;
      font-size: 12px;
      padding: 8px 0;
    }

    .scan-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .scan-score {
      font-size: 24px;
      font-weight: 700;
    }

    .scan-score.danger { color: #ef4444; }
    .scan-score.caution { color: #f59e0b; }
    .scan-score.safe { color: #22c55e; }

    .scan-details {
      text-align: right;
    }

    .scan-details .label {
      font-size: 11px;
      color: #71717a;
    }

    .scan-details .value {
      font-size: 13px;
      color: #d4d4d8;
      font-weight: 500;
    }

    .scan-time {
      font-size: 11px;
      color: #52525b;
      margin-top: 8px;
    }

    .footer {
      padding: 14px 20px 18px;
      text-align: center;
    }

    .footer a {
      color: #6366f1;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .status-text {
      font-size: 11px;
      margin-top: 6px;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .status-text.success {
      color: #22c55e;
      background: rgba(34,197,94,0.08);
    }

    .status-text.error {
      color: #ef4444;
      background: rgba(239,68,68,0.08);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">E</div>
    <div class="header-text">
      <h1>EraseAI Firewall</h1>
      <p>AI prompt privacy protection</p>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Status</div>
    <div class="diag checking" id="diag-card">
      <div class="diag-head">
        <span class="diag-dot"></span>
        <span class="diag-title" id="diag-title">Checking…</span>
      </div>
      <div class="diag-detail" id="diag-detail">Probing the EraseAI API.</div>
      <div class="diag-actions" id="diag-actions"></div>
      <div class="last-attempt empty" id="last-attempt-line">Last attempt: none yet</div>
    </div>
    <div class="toggle-row">
      <span class="label">Firewall enabled</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">API Key</div>
    <div class="input-group">
      <label>Your EraseAI API Key</label>
      <div class="input-row">
        <input type="password" class="input-field" id="api-key-input" placeholder="eak_xxxxxxxxxxxxxxxx">
        <button class="btn btn-primary" id="save-key-btn">Save</button>
      </div>
      <div id="key-status" class="status-text" style="display:none"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Last Scan</div>
    <div class="scan-summary" id="scan-summary">
      <div class="no-scans">No scans yet</div>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="dashboard-link">Open EraseAI Dashboard →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
