kind = "video"
previewPath = "/landing-video/"
title = "EraseAI Landing Page Video"
version = "1.0.0"
id = "artifacts/landing-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/landing-video/" ]
localPort = 20131

[services.development]
run = "pnpm --filter @workspace/landing-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/landing-video", "run", "build" ]
publicDir = "artifacts/landing-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20131"
BASE_PATH = "/landing-video/"
