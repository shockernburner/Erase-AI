kind = "slides"
previewPath = "/investor-deck-cn/"
title = "EraseAI 投资路演 (中文)"
version = "1.0.0"
id = "artifacts/investor-deck-cn"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/investor-deck-cn/" ]
localPort = 24100

[services.development]
run = "pnpm --filter @workspace/investor-deck-cn run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/investor-deck-cn", "run", "build" ]
publicDir = "artifacts/investor-deck-cn/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24100"
BASE_PATH = "/investor-deck-cn/"
