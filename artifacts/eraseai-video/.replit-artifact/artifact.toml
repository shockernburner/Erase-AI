kind = "video"
previewPath = "/eraseai-video/"
title = "EraseAI System Explainer"
version = "1.0.0"
id = "artifacts/eraseai-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/eraseai-video/" ]
localPort = 21735

[services.development]
run = "pnpm --filter @workspace/eraseai-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eraseai-video", "run", "build" ]
publicDir = "artifacts/eraseai-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21735"
BASE_PATH = "/eraseai-video/"
