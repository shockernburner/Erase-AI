kind = "video"
previewPath = "/firewall-video/"
title = "EraseAI Firewall - Demo Video"
version = "1.0.0"
id = "artifacts/firewall-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/firewall-video/" ]
localPort = 18524

[services.development]
run = "pnpm --filter @workspace/firewall-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/firewall-video", "run", "build" ]
publicDir = "artifacts/firewall-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18524"
BASE_PATH = "/firewall-video/"
