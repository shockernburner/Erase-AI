<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>02 Dashboard</title>
  <link rel="stylesheet" href="_shared.css" />
</head>
<body>
  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons">●●● Wi‑Fi 100%</span>
    </div>
    <div class="top-bar"><h1>Firewall Home</h1></div>
    <div class="content">
      <div class="row-between">
        <div>
          <div class="headline-sm">AI Firewall for your phone</div>
          <p class="body">Warn, redact, or block risky prompts before they leave selected AI apps.</p>
        </div>
        <div class="settings-btn">⚙</div>
      </div>

      <div class="stat-row">
        <div class="card">
          <div class="label">Firewall</div>
          <div class="value on">On</div>
        </div>
        <div class="card">
          <div class="label">Accessibility</div>
          <div class="value">Enabled</div>
        </div>
      </div>
      <div class="stat-row">
        <div class="card">
          <div class="label">Subscription</div>
          <div class="value">Trial · 18/25</div>
        </div>
        <div class="card">
          <div class="label">Protected Apps</div>
          <div class="value">4</div>
        </div>
      </div>
      <div class="stat-row">
        <div class="card">
          <div class="label">Scans Used</div>
          <div class="value">18/25</div>
        </div>
        <div class="card">
          <div class="label">Last Action</div>
          <div class="value">Sanitized</div>
        </div>
      </div>

      <div class="switch-row">
        <span>Firewall scanning</span>
        <div class="switch"></div>
      </div>

      <button class="btn btn-primary">Enable AI Firewall</button>
      <button class="btn btn-outline">Choose Protected Apps</button>
      <button class="btn btn-outline">Manual / Share Scan</button>
      <button class="btn btn-outline">Trial &amp; Subscription</button>
      <div class="btn-row">
        <button class="btn btn-text">Refresh</button>
        <button class="btn btn-text">Privacy</button>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
