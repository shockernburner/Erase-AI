previewPath = "/"
title = "EraseAI"
id = "artifacts/eraseai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/eraseai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eraseai", "run", "build" ]
publicDir = "artifacts/eraseai/dist/public"
serve = "static"

# Prerendered pages (scripts/prerender.mjs checks this list at build time).
[[services.production.rewrites]]
from = "/learn"
to = "/_pages/learn.html"

