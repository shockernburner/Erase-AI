kind = "web"
previewPath = "/"
title = "EraseAI"
version = "1.0.0"
id = "artifacts/eraseai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22439

[services.development]
run = "pnpm --filter @workspace/eraseai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eraseai", "run", "build" ]
publicDir = "artifacts/eraseai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22439"
BASE_PATH = "/"
