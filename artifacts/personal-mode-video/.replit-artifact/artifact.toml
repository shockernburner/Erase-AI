kind = "video"
previewPath = "/personal-mode-video/"
title = "EraseAI Personal Mode - Social Media Video"
version = "1.0.0"
id = "artifacts/personal-mode-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/personal-mode-video/" ]
localPort = 18520

[services.development]
run = "pnpm --filter @workspace/personal-mode-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/personal-mode-video", "run", "build" ]
publicDir = "artifacts/personal-mode-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18520"
BASE_PATH = "/personal-mode-video/"
